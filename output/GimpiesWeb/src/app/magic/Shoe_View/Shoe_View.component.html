<div novalidate [formGroup]="screenFormGroup">
    <div  [magic]="mgc.Shoe_View">

    </div>
</div>
<!-- Zoekveld voor filter -->
<div class="mb-6 flex justify-center">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Zoek op merk, type of kleur..."
    class="search-input w-full sm:w-96 px-4 py-2 rounded-full shadow-sm transition"
  >
</div>



<!-- Schoenencards, netjes onder Magic layout -->
<div *ngIf="Shoe_Data.length > 0" class="mt-6">
  <!-- Responsive grid: tot 4 naast elkaar -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    <div *ngFor="let shoe of filteredShoes" class="shoe-card p-4 bg-white rounded-xl shadow">

      <!-- Flex layout: tekst links, afbeelding rechts -->
      <div class="flex items-center justify-between w-full gap-4">

        <!-- Tekstblok helemaal links -->
        <div class="text-left flex-1">
          <h3 class="text-lg font-bold">{{ shoe.Brand_Name }} - {{ shoe.Type_Name }}</h3>
          <p>Maat: {{ shoe.Value }}</p>
          <p>Kleur: {{ shoe.Color_Name }}</p>
          <p>Voorraad: {{ shoe.Quantity }}</p>
          <p class="font-semibold">€{{ shoe.Price }}</p>
        </div>

        <!-- Afbeelding helemaal rechts -->
        <div class="flex-shrink-0">
          <img
            [src]="shoe.ImageUrl"
            alt="{{ shoe.Brand_Name }} {{ shoe.Type_Name }}"
            class="w-32 h-32 object-contain rounded bg-white p-1 hover:scale-105 transition"
            (click)="openImage(shoe.ImageUrl)"
          >

        </div>

      </div>

    </div>
  </div>

  <!-- Overlay met vergrote afbeelding -->
  <div
    *ngIf="selectedImage"
    class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50"
    (click)="closeImage()"
  >
    <img
      [src]="selectedImage"
      class="max-w-[90%] max-h-[90%] rounded shadow-lg"
      (click)="$event.stopPropagation()"
    />
  </div>
</div>
