<div class="flex h-screen">
  <!-- Sidebar -->
  <aside
    [ngClass]="sidebarCollapsed ? 'w-16' : 'w-64'"
    class="bg-gray-100 transition-all duration-300 p-4"
  >
    <!-- Toggle knop bovenin -->
    <button (click)="toggleSidebar()" class="mb-4 bg-gray-300 px-2 py-1 rounded">
      {{ sidebarCollapsed ? '→' : '←' }}
    </button>
    <!-- Sidebar inhoud alleen tonen als niet collapsed -->
    <app-sidebar [collapsed]="sidebarCollapsed"></app-sidebar>
  </aside>
  <!-- Main content -->
  <main class="flex-1 overflow-auto p-4">
    <router-outlet></router-outlet>
  </main>
</div>
