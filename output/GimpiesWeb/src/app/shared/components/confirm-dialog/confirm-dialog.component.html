<div class="p-4">
  <h2 class="text-xl font-semibold mb-2 text-gray-800">
    {{ data.title }}
  </h2>

  <div class="text-gray-600 mb-6">
    {{ data.message }}
  </div>

  <div class="flex justify-end gap-3">
    <button mat-button (click)="onCancel()" class="text-gray-500 hover:text-gray-700">
      Annuleer
    </button>
    <button mat-raised-button color="warn" (click)="onConfirm()" class="px-4">
      Bevestigen
    </button>
  </div>
</div>
