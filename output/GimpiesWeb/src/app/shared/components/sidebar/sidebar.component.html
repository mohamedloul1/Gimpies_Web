<div class="flex flex-col ">
  <!-- Gebruiker bovenin -->
  <div class="flex items-center space-x-3 mb-6">
    <img src="https://as2.ftcdn.net/v2/jpg/02/45/56/35/1000_F_245563558_XH9Pe5LJI2kr7VQuzQKAjAbz9PAyejG1.jpg" class="w-10 h-10 rounded-full" />
    <div *ngIf="!collapsed">
      <div class="font-semibold text-gray-800">Ahmed Gimpie</div>
      <div class="text-sm text-gray-500">Admin</div>
      <div class="sidebar-header">
        Welkom, {{ username }}
      </div>

    </div>
  </div>
<nav class="flex flex-col space-y-4 flex-grow">
  <a
    routerLink="/admin"
    routerLinkActive="bg-blue-100 text-blue-700 font-semibold"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center space-x-2 p-2 rounded hover:bg-gray-200 transition"
    (click)="onLinkClick()"
  >
    <span>📊</span>
    <span *ngIf="!collapsed">Dashboard</span>
  </a>


  <a
    routerLink="/"
    routerLinkActive="bg-blue-100 text-blue-700 font-semibold"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center space-x-2 p-2 rounded hover:bg-gray-200 transition"
    (click)="onLinkClick()"
  >
    <span>📦</span>
    <span *ngIf="!collapsed">Voorraad</span>
  </a>

  <a
    routerLink="/sales"
    routerLinkActive="bg-blue-100 text-blue-700 font-semibold"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center space-x-2 p-2 rounded hover:bg-gray-200 transition"
    (click)="onLinkClick()"
  >
    <span>🛒</span>
    <span *ngIf="!collapsed">Verkopen</span>
  </a>

  <a
    routerLink="/"
    routerLinkActive="bg-blue-100 text-blue-700 font-semibold"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex items-center space-x-2 p-2 rounded hover:bg-gray-200 transition"
    (click)="onLinkClick()"
  >
    <span>📥</span>
    <span *ngIf="!collapsed">Inkopen</span>
  </a>
</nav>

<!-- logout knop onderaan gecentreerd -->
<div class="mt-10 flex justify-center">
  <button
    (click)="logout()"
    class="flex items-center justify-center space-x-2 p-2 rounded hover:bg-red-100 text-red-600 transition"
    [ngClass]="collapsed ? 'w-10 h-10' : 'w-full'"
  >
    <span>🚪</span>
    <span *ngIf="!collapsed">Logout</span>
  </button>
</div>
