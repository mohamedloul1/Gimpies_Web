<div
  class="flex gap-4 items-start border rounded p-3 shadow-sm hover:shadow-md transition bg-white w-full relative"
>
  <!-- 📷 Afbeelding -->
  <div class="min-w-[80px] w-[80px] h-[80px] rounded overflow-hidden flex items-center justify-center bg-gray-100">
    <img
      [src]="shoe.imageUrl"
      [alt]="shoe.Brand_Name + ' ' + shoe.Type_Name"
      class="max-h-full max-w-full object-contain"
    />
  </div>

  <!-- 📃 Info -->
  <div class="flex-1">
    <div class="flex justify-between">
      <div>
        <div class="font-semibold break-words whitespace-normal">
          {{ shoe.Brand_Name }} - {{ shoe.Type_Name }}
        </div>
        <div class="text-gray-500 leading-snug">
          Maat: {{ shoe.Value }}<br>
          Kleur: {{ shoe.Color_Name }}<br>
          Voorraad: {{ shoe.Quantity }}<br>
          <span class="font-semibold text-gray-700">€{{ shoe.Price }}</span>
        </div>
      </div>


      <!-- ❌ Verwijder-knop -->
      <button
        *ngIf="removable"
        (click)="remove.emit()"
        mat-icon-button
        class="text-red-600 hover:text-red-800 text-xs"
        [attr.aria-label]="'Verwijder ' + shoe.Brand_Name"
      >
        <mat-icon fontSize="16">delete</mat-icon>
      </button>
    </div>

    <!-- ➕➖ Aantal aanpassen -->
    <div *ngIf="!readonly" class="flex items-center gap-2 mt-2">
      <button
        class="text-xs px-2 py-1 rounded bg-gray-100 hover:bg-gray-200"
        (click)="decrease($event)"
      >−</button>

      <input
        type="number"
        class="text-center border rounded px-2 py-1 w-14 text-xs"
        [value]="shoe.amount || 1"
        [min]="1"
        [max]="shoe.Quantity"
        (input)="onAmountInput($event)"
      />

      <button
        class="text-xs px-2 py-1 rounded bg-gray-100 hover:bg-gray-200"
        (click)="increase($event)"
      >+</button>
    </div>
  </div>
</div>
