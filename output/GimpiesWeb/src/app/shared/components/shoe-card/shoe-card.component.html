<div
  class="shoe-card group h-full p-4 bg-white rounded-xl shadow cursor-pointer transition border-2 flex flex-col justify-between"
  [class.selected]="selected"
  (click)="onCardClick()"
>
  <!-- 📷 Afbeelding -->
  <div class="w-full aspect-[4/3] mb-4 overflow-hidden rounded bg-white flex items-center justify-center">
    <img
      [src]="shoe.imageUrl"
      alt="{{ shoe.Brand_Name }} {{ shoe.Type_Name }}"
      class="max-h-full max-w-full object-contain p-1 group-hover:scale-105 transition duration-300"
      (click)="onImageClick($event)"
    />
  </div>

  <!-- 📃 Tekst -->
  <div class="text-left space-y-1">
    <h3 class="text-base md:text-lg font-semibold leading-tight truncate">
      {{ shoe.Brand_Name }} - {{ shoe.Type_Name }}
    </h3>
    <p class="text-sm md:text-base">Maat: {{ shoe.Value }}</p>
    <p class="text-sm md:text-base">Kleur: {{ shoe.Color_Name }}</p>
    <p class="text-sm md:text-base">Voorraad: {{ shoe.Quantity }}</p>
    <p class="text-sm md:text-base font-bold">€{{ shoe.Price }}</p>
  </div>
</div>
