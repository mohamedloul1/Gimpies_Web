<div
  class="shoe-card group h-full p-4 bg-white rounded-xl shadow cursor-pointer transition border-2 flex flex-col justify-between relative"
  [class.selected]="selected"
  (click)="onCardClick()"
>
  <!-- 🗑️ Delete-knop rechtsboven -->
  <div class="remove-select absolute top-2 left-2 z-20">
    <button
      *ngIf="removable"
      mat-icon-button
      color="warn"
      class="bg-white border border-red-200 rounded-full shadow-sm hover:bg-red-50 transition"
      (click)="onRemove($event)"
    >
      <mat-icon fontSize="20">delete</mat-icon>
    </button>
  </div>

  <!-- 📷 Afbeelding -->
  <div class="w-full aspect-[4/3] mb-4 overflow-hidden rounded bg-white flex items-center justify-center">
    <img
      [src]="shoe.imageUrl"
      alt="{{ shoe.Brand_Name }} {{ shoe.Type_Name }}"
      class="max-h-full max-w-full object-contain p-1 group-hover:scale-105 transition duration-300"
      (click)="onImageClick($event)"
    />
  </div>

  <!-- 📃 Tekst -->
  <div class="text-left space-y-1">
    <h3 class="text-base md:text-lg font-semibold leading-tight truncate">
      {{ shoe.Brand_Name }} - {{ shoe.Type_Name }}
    </h3>
    <p class="text-sm md:text-base">Maat: {{ shoe.Value }}</p>
    <p class="text-sm md:text-base">Kleur: {{ shoe.Color_Name }}</p>
    <p class="text-sm md:text-base">Voorraad: {{ shoe.Quantity }}</p>
    <p class="text-sm md:text-base font-bold">€{{ shoe.Price }}</p>
  </div>

  <!-- ➕➖ Footer met aantal -->
  <div
    *ngIf="selected && !readonly"
    class="mt-3 pt-3 border-t border-gray-200 flex items-center justify-center gap-2"
    (click)="$event.stopPropagation()"
  >
    <button
      class="text-base font-bold px-3 py-1 rounded bg-gray-100 hover:bg-gray-200 flex-shrink-0"
      (click)="decrease($event)"
    >−</button>

    <input
      type="number"
      class="text-center border rounded px-2 py-1 w-14 sm:w-16 text-sm"
      [value]="amount"
      [min]="1"
      [max]="shoe.Quantity"
      (click)="$event.stopPropagation()"
      (input)="onAmountInput($event)"
    />

    <button
      class="text-base font-bold px-3 py-1 rounded bg-gray-100 hover:bg-gray-200 flex-shrink-0"
      (click)="increase($event)"
    >+</button>
  </div>

</div>
