name: CI (Angular demo)

on:
  push:
    branches: [ feature/cli-demo ]
  workflow_dispatch: {}

env:
  NODE_VERSION: '18'
  WORKDIR: output/GimpiesWeb
  ANGULAR_DIST_DIR: dist/gimpies-web

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Show env
        run: |
          node -v
          npm -v
          echo "Repo root:" && ls -la
          echo "App dir ($WORKDIR):" && ls -la "$WORKDIR"
      - name: Install deps (robust)
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund --legacy-peer-deps

  build:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps (reuse)
        working-directory: ${{ env.WORKDIR }}
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: npm run build || npm run build --if-present

      - name: List build output
        run: ls -la "${{ env.WORKDIR }}/${{ env.ANGULAR_DIST_DIR }}"

      - name: Upload artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: ${{ env.WORKDIR }}/${{ env.ANGULAR_DIST_DIR }}

  deploy_placeholder:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/heads/feature/cli-demo') }}
    steps:
      - name: Manual deploy placeholder
        run: echo "Manual/placeholder deploy – geen echte uitrol."
