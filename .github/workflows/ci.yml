name: CI (Angular demo)

on:
  push:
    branches: [ feature/cli-demo ]
  workflow_dispatch: {}

env:
  ANGULAR_DIST_DIR: dist/gimpies-web
  NODE_VERSION: '18'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install deps
        run: npm ci || npm install --no-audit --no-fund --legacy-peer-deps

  build:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install deps (reuse cache)
        run: npm ci || npm install --no-audit --no-fund --legacy-peer-deps
      - name: Build
        run: npm run build || npm run build --if-present
      - name: List build output
        run: ls -la "$ANGULAR_DIST_DIR" || (echo "Check ANGULAR_DIST_DIR" && exit 1)
      - name: Upload artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: ${{ env.ANGULAR_DIST_DIR }}

  deploy_placeholder:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/heads/feature/cli-demo') }}
    steps:
      - name: Manual deploy placeholder
        run: echo "Manual/placeholder deploy – geen echte uitrol."
