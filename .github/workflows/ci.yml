name: CI (Angular demo)

on:
  push:
    branches: [ feature/cli-demo ]
  workflow_dispatch: {}

env:
  NODE_VERSION: '18'
  # Relatief t.o.v. de map waar package.json staat
  ANGULAR_DIST_DIR: dist/gimpies-web

jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      WORKDIR: ${{ steps.detect.outputs.workdir }}
      DIST_DIR_PATH: ${{ steps.detect.outputs.dist_dir_path }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Detect workdir (where package.json lives)
        id: detect
        shell: bash
        run: |
          set -e
          echo "Repo root: $(pwd)"
          echo "Listing root:"
          ls -la
          if [ -f package.json ]; then
            WORKDIR="."
          else
            CANDIDATE="$(find . -maxdepth 3 -type f -name package.json | head -n1)"
            if [ -z "$CANDIDATE" ]; then
              echo "❌ No package.json found within 3 levels."
              exit 1
            fi
            WORKDIR="$(dirname "$CANDIDATE")"
          fi
          DIST_DIR_PATH="$WORKDIR/${ANGULAR_DIST_DIR}"
          echo "Detected WORKDIR: $WORKDIR"
          echo "DIST_DIR_PATH: $DIST_DIR_PATH"
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"
          echo "dist_dir_path=$DIST_DIR_PATH" >> "$GITHUB_OUTPUT"

      - name: Install deps (works with or without lockfile)
        working-directory: ${{ steps.detect.outputs.workdir }}
        run: |
          if [ -f package-lock.json ]; then
            echo "Found lockfile → npm ci"
            npm ci
          else
            echo "No lockfile → npm install"
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

  build:
    runs-on: ubuntu-latest
    needs: install
    env:
      WORKDIR: ${{ needs.install.outputs.WORKDIR }}
      DIST_DIR_PATH: ${{ needs.install.outputs.DIST_DIR_PATH }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Confirm paths
        run: |
          echo "WORKDIR=${WORKDIR}"
          echo "DIST_DIR_PATH=${DIST_DIR_PATH}"
          ls -la

      - name: Install deps (reuse)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi

      - name: Build
        run: npm run build || npm run build --if-present

      - name: List build output
        run: ls -la "${DIST_DIR_PATH}" || (echo "Check ANGULAR_DIST_DIR relative to WORKDIR=${WORKDIR}" && exit 1)

      - name: Upload artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: ${{ env.DIST_DIR_PATH }}

  deploy_placeholder:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ startsWith(github.ref, 'refs/heads/feature/cli-demo') }}
    steps:
      - name: Manual deploy placeholder
        run: echo "Manual/placeholder deploy – geen echte uitrol."
